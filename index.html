<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>slotly — booking and scheduling</title>
<meta name="description" content="slotly is a front-desk booking and scheduling demo: token queue, week calendar across staff, bookings, services, working hours and message templates. Sample data only.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EAC81C">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Slotly">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./assets/app.css">
<link rel="stylesheet" href="./assets/slotly.css">
<script>
/* Paint in the right theme before the first frame: the stored choice if there
   is one, otherwise whatever the operating system asks for. src/chrome.js owns
   the same key and takes over from here. */
(function(){try{var m=localStorage.getItem('slotly.theme');
if(m!=='dark'&&m!=='light'){m=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';}
if(m==='dark'){document.documentElement.setAttribute('data-theme','dark');}
document.documentElement.style.colorScheme=m;}catch(e){}})();
</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23EAC81C'/%3E%3Cpath d='M16 8v8l5 3' fill='none' stroke='%2317181A' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
</head>
<body>
<noscript>slotly runs entirely in the browser and needs JavaScript enabled. Nothing is sent anywhere — all data is sample data held in this browser.</noscript>
<div id="app"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
